<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obfusly Security Widget</title>

        <!-- Test/Playground: Embeddable Widget Script -->
        <div style="margin-top: 40px; padding: 20px; background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px;">
            <h2 style="color: #333; font-size: 18px; margin-bottom: 15px;">Widget Playground</h2>
            <p style="color: #666; font-size: 13px; margin-bottom: 15px;">Edit the script below to test the widget - it will appear in the corner of the page:</p>
            <textarea id="widgetScript" style="width: 100%; height: 400px; padding: 12px; font-family: 'Monaco', monospace; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; resize: vertical;">
(function() {
    // Inject bounce animation CSS
    var style = document.createElement('style');
    style.innerHTML = `
        @keyframes iconBounce {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-2px); }
            100% { transform: translateY(0px); }
        }
        .icon-bouncing {
            animation: iconBounce 1.5s ease-in-out infinite !important;
        }
    `;
    document.head.appendChild(style);

    // Load Google Font
    var fontLink = document.createElement('link');
    fontLink.href = "https://fonts.googleapis.com/css?family=Baloo+Paaji";
    fontLink.rel = "stylesheet";
    document.head.appendChild(fontLink);

    var widgetContainer = document.createElement('div');
    widgetContainer.style.position = "fixed";
    widgetContainer.style.bottom = "20px";
    widgetContainer.style.right = "20px";
    widgetContainer.style.width = "50px";
    widgetContainer.style.fontFamily = "Baloo Paaji";
    widgetContainer.style.height = "50px";
    widgetContainer.style.borderRadius = "15px";
    widgetContainer.style.backgroundColor = "black"
    widgetContainer.style.display = "flex";
    widgetContainer.style.alignItems = "center";
    widgetContainer.style.justifyContent = "center";
    widgetContainer.style.cursor = "pointer";
    widgetContainer.style.boxShadow = "rgba(0, 0, 0, 0.5) 2px 2px 10px";
    widgetContainer.style.transition = "0.5s";
    widgetContainer.style.overflow = "hidden";
    widgetContainer.style.zIndex = "9999";

    var button = document.createElement('a');
    button.href = "https://obfusly.com";
    button.target = "_blank";
    button.style.display = "flex";
    button.style.width = "100%";
    button.style.height = "100%";
    button.style.textDecoration = "none";
    button.style.color = "#f0f4f8";
    button.style.transition = "transform 0.5s ease";

    var icon = document.createElement('img');
    icon.style.transition = "transform 0.5s ease";
    icon.style.marginLeft = "5px";
    icon.style.marginTop = "5px";
    icon.style.width = "40px";
    icon.style.height = "40px";
    icon.src = "name-logo.png";
    var textContainer = document.createElement("span");
    textContainer.style.display = "block";
    textContainer.style.flexDirection = "column";
    textContainer.style.opacity = "0";
    textContainer.style.whiteSpace = "nowrap";
    textContainer.style.overflow = "hidden";
    textContainer.style.lineHeight = "1";
    textContainer.style.width = "105px";
    textContainer.style.visibility = "hidden";
    textContainer.style.transition = "opacity .5s ease-in-out, visibility .5s ease-in-out";

    var poweredByText = document.createElement("div");
    poweredByText.style.fontSize = "16px";
    poweredByText.style.display = "block";
    poweredByText.style.marginLeft = "10px";
    poweredByText.style.marginTop = "8px";
    poweredByText.style.color = "#f0f4f8";
    poweredByText.innerText = "Protected By";

    var brandText = document.createElement("div");
    brandText.style.fontSize = "20px";
    brandText.style.fontStyle = "italic";
    brandText.style.marginLeft = "18px";
    brandText.style.marginBottom = "-15px";
    brandText.style.color = "#00d4ff";
    brandText.innerText = "Obfusly";

    textContainer.appendChild(poweredByText);
    textContainer.appendChild(brandText);

    button.appendChild(icon);
    button.appendChild(textContainer);
    widgetContainer.appendChild(button);

    document.body.appendChild(widgetContainer);

    widgetContainer.addEventListener("mouseover", function() {
        widgetContainer.style.width = "175px";
        icon.style.transform = "translateX(3px)";
        icon.classList.add('icon-bouncing');
        textContainer.style.opacity = "1";
        textContainer.style.visibility = "visible";
    });

    widgetContainer.addEventListener("mouseout", function() {
        widgetContainer.style.width = "50px";
        icon.style.transform = "translateX(0)";
        icon.classList.remove('icon-bouncing');
        textContainer.style.opacity = "0";
        textContainer.style.visibility = "hidden";
    });

})();
            </textarea>
            <button onclick="runWidgetCode()" style="margin-top: 10px; padding: 10px 20px; background: #ffc107; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Run Widget Script</button>
        </div>
    </div>

    <script>
        function runWidgetCode() {
            var code = document.getElementById('widgetScript').value;
            try {
                eval(code);
                // alert('Widget loaded! Check the bottom right of the page.');
            } catch(err) {
                alert('Error: ' + err.message);
            }
        }
    </script>
</body>
</html>
